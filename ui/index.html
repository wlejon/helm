<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Helm Desktop</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/media.css">
</head>
<body class="desktop-root">
  <!-- Desktop Wallpaper Surface -->
  <div class="desktop-wallpaper" id="wallpaper"></div>

  <!-- Top Status Bar (Panel) -->
  <header class="top-panel" id="top-panel">
    <!-- Left: App Menu / Activities / Launcher Search Pill -->
    <div class="panel-section panel-left">
      <button class="panel-btn brand-btn" id="btn-activities" title="Applications & Activities">
        <span class="brand-logo">⎈</span>
        <span class="brand-label">Helm</span>
      </button>
      <button class="search-pill-btn" id="btn-launcher-pill" title="Search applications & commands (Ctrl+Space)">
        <span class="icon">🔍</span>
        <span class="search-pill-label">Search apps...</span>
        <kbd class="shortcut-badge">⌃Space</kbd>
      </button>
      <div class="workspace-pager" id="workspace-pager">
        <span class="workspace-pill active" data-index="1">1</span>
        <span class="workspace-pill" data-index="2">2</span>
        <span class="workspace-pill" data-index="3">3</span>
      </div>
    </div>

    <!-- Center: Clock & Date + Media Player -->
    <div class="panel-section panel-center">
      <div class="panel-media-widget hidden" id="panel-media-widget">
        <button class="panel-btn" id="media-prev-btn" title="Previous Track">⏮</button>
        <button class="panel-btn" id="media-play-btn" title="Play/Pause">▶</button>
        <button class="panel-btn" id="media-next-btn" title="Next Track">⏭</button>
        <span class="media-title" id="media-title">No Media</span>
      </div>
      <button class="panel-btn clock-btn" id="btn-clock" title="Toggle calendar & notifications">
        <span class="clock-time" id="panel-clock-time">12:00</span>
        <span class="clock-date" id="panel-clock-date">Mon, Oct 6</span>
      </button>
    </div>

    <!-- Right: Quick Status & Tray -->
    <div class="panel-section panel-right">
      <!-- System Tray (populated from bro.sys.tray) -->
      <div class="system-tray" id="system-tray"></div>

      <!-- Quick Status Indicators -->
      <div class="quick-status-group">
        <button class="panel-btn status-btn" id="btn-quick-net" title="Network settings">
          <span class="status-icon" id="icon-net">📶</span>
          <span class="status-text" id="text-net">Online</span>
        </button>
        <button class="panel-btn status-btn" id="btn-quick-volume" title="Volume control">
          <span class="status-icon" id="icon-volume">🔊</span>
          <span class="status-text" id="text-volume">80%</span>
        </button>
        <button class="panel-btn status-btn" id="btn-quick-battery" title="Battery & Power">
          <span class="status-icon" id="icon-battery">🔋</span>
          <span class="status-text" id="text-battery">100%</span>
        </button>
      </div>

      <!-- Notification Toggle -->
      <button class="panel-btn icon-only-btn" id="btn-notify-toggle" title="Notifications">
        <span class="icon">🔔</span>
        <span class="badge" id="notify-badge">0</span>
      </button>

      <!-- Session / Lock Button -->
      <button class="panel-btn icon-only-btn" id="btn-session-lock" title="Lock screen (Ctrl+Alt+L)">
        <span class="icon">🔒</span>
      </button>
    </div>
  </header>

  <!-- Quick Settings Popups -->
  <div class="quick-popup-container" id="quick-popup-container">
    <!-- Volume Popup -->
    <div class="quick-popup hidden" id="popup-volume">
      <div class="popup-header">
        <span class="popup-title">Volume Control</span>
        <button class="popup-mute-btn" id="vol-mute-btn">Mute</button>
      </div>
      <div class="popup-body">
        <input type="range" min="0" max="100" value="80" class="slider volume-slider" id="vol-slider">
        <div class="volume-device-info" id="vol-device-name">Default Audio Output</div>
      </div>
    </div>

    <!-- Network Popup -->
    <div class="quick-popup hidden" id="popup-network">
      <div class="popup-header">
        <span class="popup-title">Network & Internet</span>
      </div>
      <div class="popup-body">
        <div class="net-status-line" id="net-detail-text">Connected to Local Network</div>
        <div class="net-ip-line" id="net-ip-text">IP: 127.0.0.1</div>
      </div>
    </div>

    <!-- Power Popup -->
    <div class="quick-popup hidden" id="popup-power">
      <div class="popup-header">
        <span class="popup-title">Power & Session</span>
      </div>
      <div class="popup-body">
        <div class="power-battery-status" id="power-battery-text">Battery: 100% (AC connected)</div>
        <div class="power-actions-grid">
          <button class="power-action-btn" id="power-btn-lock">🔒 Lock</button>
          <button class="power-action-btn" id="power-btn-suspend">💤 Sleep</button>
          <button class="power-action-btn" id="power-btn-restart">🔄 Restart</button>
          <button class="power-action-btn power-btn-danger" id="power-btn-shutdown">⏻ Shut Down</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Toasts Overlay Container (Top-Right) -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Notification Drawer (Slide-in sidebar) -->
  <aside class="notify-drawer hidden" id="notify-drawer">
    <div class="drawer-header">
      <div class="drawer-title-row">
        <h2 class="drawer-title">Notifications</h2>
        <div class="drawer-actions">
          <button class="drawer-action-btn" id="btn-dnd-toggle">DND: Off</button>
          <button class="drawer-action-btn" id="btn-clear-notifications">Clear All</button>
        </div>
      </div>
    </div>
    <div class="drawer-content" id="notify-history-list">
      <div class="empty-state" id="notify-empty-state">No notifications</div>
    </div>
  </aside>

  <!-- Spotlight-Style Launcher Modal (Centered) -->
  <div class="launcher-overlay hidden" id="launcher-modal">
    <div class="launcher-backdrop" id="launcher-backdrop"></div>
    <div class="launcher-window">
      <div class="launcher-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="launcher-input" id="launcher-input"
               placeholder="Search applications, files, settings..." autocomplete="off" spellcheck="false">
        <kbd class="launcher-esc-badge">ESC</kbd>
      </div>
      <div class="launcher-body">
        <div class="launcher-results" id="launcher-results"></div>
      </div>
      <div class="launcher-footer">
        <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="hint"><kbd>↵</kbd> Launch</span>
        <span class="hint"><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <!-- Session Lock Screen (Fullscreen Modal) -->
  <div class="lock-screen hidden" id="lock-screen">
    <div class="lock-background"></div>
    <div class="lock-container">
      <div class="lock-clock-section">
        <div class="lock-clock-time" id="lock-clock-time">12:00</div>
        <div class="lock-clock-date" id="lock-clock-date">Monday, October 6</div>
      </div>
      <div class="lock-auth-box">
        <div class="lock-avatar">👤</div>
        <div class="lock-username" id="lock-username">User</div>
        <form class="lock-form" id="lock-form">
          <div class="lock-input-group">
            <input type="password" class="lock-password-input" id="lock-password"
                   placeholder="Enter password..." autocomplete="current-password">
            <button type="submit" class="lock-submit-btn" id="lock-submit">➔</button>
          </div>
          <div class="lock-error-msg hidden" id="lock-error-msg">Incorrect password. Please try again.</div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/shell.js"></script>
</body>
</html>
