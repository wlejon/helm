<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Helm Desktop</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/bar.css">
  <link rel="stylesheet" href="css/popovers.css">
  <link rel="stylesheet" href="css/launcher.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/settings-views.css">
  <link rel="stylesheet" href="css/lock.css">
</head>
<body class="desktop-root">
  <!-- Desktop level (z-index < 1000): drawn under client windows. -->
  <div class="desktop-wallpaper" id="wallpaper"></div>

  <!-- Shell overlays (z-index >= 1000): drawn over client windows, and
       bro's DRM input routing gives them the pointer. Overlays that take keys
       carry data-shell-keyboard: while one is rendered (no .hidden), keys go
       to the shell rather than the focused window. -->
  <header class="bar" id="top-panel">
    <div class="bar-left">
      <button class="bar-btn bar-logo" id="bar-launcher" title="Applications (Super)"><i data-icon="helm"></i></button>
      <div class="workspaces" id="workspaces"></div>
      <div class="bar-focused" id="bar-focused"></div>
    </div>
    <div class="bar-center">
      <button class="bar-btn bar-clock" id="bar-clock" title="Calendar and notifications">
        <span class="clock-date"></span>
        <span class="clock-time"></span>
        <i data-icon="bell-off" class="dnd-glyph hidden"></i>
        <span class="badge-dot hidden"></span>
      </button>
    </div>
    <div class="bar-right">
      <button class="bar-btn bar-media hidden" id="bar-media"></button>
      <div class="tray" id="tray"></div>
      <button class="bar-btn bar-status" id="bar-status" title="Quick settings"></button>
    </div>
  </header>

  <section class="popover qs hidden" id="quick-settings" data-shell-keyboard></section>
  <section class="popover cal-pop hidden" id="calendar-popover" data-shell-keyboard></section>

  <nav class="dock" id="dock"></nav>
  <div class="dock-edge hidden" id="dock-edge"></div>

  <div class="toast-stack" id="toast-stack"></div>
  <div class="osd hidden" id="osd"></div>

  <!-- data-shell-keyboard: while visible, keys go to the shell rather than
       the focused window. -->
  <div class="switcher hidden" id="switcher" data-shell-keyboard></div>

  <div class="settings-overlay hidden" id="settings-modal" data-shell-keyboard role="dialog" aria-label="Settings">
    <div class="settings-backdrop" id="settings-backdrop"></div>
    <div class="settings-window">
      <header class="settings-header">
        <div class="settings-header-left"><span class="settings-app-title">Settings</span></div>
        <div class="settings-header-search">
          <label class="settings-search-box">
            <span class="settings-search-icon"><i data-icon="search"></i></span>
            <input type="text" class="settings-search-field" id="settings-search-input"
                   placeholder="Search settings" autocomplete="off" spellcheck="false">
          </label>
        </div>
        <button class="settings-close-button" id="settings-close-btn" title="Close (Esc)"><i data-icon="x"></i></button>
      </header>
      <div class="settings-body">
        <nav class="settings-sidebar" id="settings-sidebar-list" aria-label="Settings categories"></nav>
        <main class="settings-content-viewport" id="settings-content-viewport"></main>
      </div>
    </div>
  </div>

  <div class="launcher-overlay hidden" id="launcher-modal" data-shell-keyboard></div>

  <div class="lock-screen hidden" id="lock-screen" data-shell-keyboard></div>

  <script type="module" src="js/shell.js"></script>
</body>
</html>
