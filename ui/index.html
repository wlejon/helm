<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Helm Desktop</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/islands.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/notify.css">
  <link rel="stylesheet" href="css/launcher.css">
  <link rel="stylesheet" href="css/switcher.css">
  <link rel="stylesheet" href="css/frames.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/settings-pages.css">
  <link rel="stylesheet" href="css/lock.css">
</head>
<body class="desktop-root">
  <!-- Desktop level (z-index < 1000): drawn under client windows. -->
  <div class="desktop-wallpaper" id="wallpaper"></div>

  <!-- Window frames (js/frames.js): one [data-window-frame] per decorated
       window. bro positions each on its window and paints it just below
       that window in the stacking order, so this container stays at desktop
       level and never takes the pointer itself. -->
  <div class="window-frames" id="window-frames"></div>

  <!-- Shell overlays (z-index >= 1000) draw over client windows, and bro
       gives them the pointer. Every overlay that takes keys carries
       data-shell-keyboard. -->
  <!-- The bar along the bottom edge: three islands, each growing up into
       its panel (js/islands.js). Its band is reserved, so maximized windows
       end above it. -->
  <div class="bar" id="bar">
    <div class="island island-left" id="island-left">
      <button class="isl-btn isl-logo" id="isl-launcher" title="Applications (Super)"><i data-icon="helm"></i></button>
      <div class="ws-strip" id="workspaces"></div>
      <button class="isl-focused hidden" id="isl-focused" title="Spaces (Super+W)"></button>
    </div>

    <button class="island island-center" id="island-center" title="Calendar and notifications (Super+N)">
      <span class="clock-date"></span>
      <span class="clock-time"></span>
      <span class="live hidden" id="live-activity"></span>
      <span class="nc-count hidden"></span>
      <i data-icon="bell-off" class="dnd-glyph hidden"></i>
    </button>

    <div class="island island-right" id="island-right">
      <div class="tray" id="tray"></div>
      <button class="isl-status" id="isl-status" title="Quick settings (Super+S)"></button>
    </div>
  </div>

  <!-- Panels grow out of the island that owns them (see js/morph.js). -->
  <section class="panel quick-popup glass deep hidden" id="spaces-panel" data-shell-keyboard></section>
  <section class="panel quick-popup glass deep hidden" id="center-panel" data-shell-keyboard></section>
  <section class="panel quick-popup glass deep hidden" id="quick-settings" data-shell-keyboard></section>

  <!-- Where a dragged window will land when it snaps: over every window,
       under the bar, never hit. -->
  <div class="snap-preview hidden" id="snap-preview"></div>

  <div class="toast-stack" id="toast-stack"></div>
  <div class="osd glass hidden" id="osd"></div>
  <div class="hint glass hidden" id="hint"></div>

  <div class="switcher hidden" id="switcher" data-shell-keyboard></div>

  <div class="settings-overlay hidden" id="settings-app" data-shell-keyboard></div>

  <div class="launcher-overlay hidden" id="launcher-modal" data-shell-keyboard></div>

  <div class="lock-screen hidden" id="lock-screen" data-shell-keyboard></div>

  <script type="module" src="js/shell.js"></script>
</body>
</html>
